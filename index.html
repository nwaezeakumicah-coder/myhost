<body>
    <header class="head">

        <button class="admin_bt">Login as Admin</button>
    </header>
    <div class="form_container">
        <h3>Customer Login</h3>
        <form action="#" method="post">
            <div class="formgroup">
                <!-- <i class="bi bi-person-fill"></i> -->
                <input type="text" placeholder="ID"> <br>
                <!-- <i  class="bi bi-person-fill-lock"></i> -->

    <br><br>

    <div class="form_container">
        <h3>Registration<h3>
        <form action="#" method="post">
            <div class="formgroup">
                <input type="text" placeholder="Enter your ID">  <br> 
                <input type="text" placeholder="Enter your Full Name"> <br>
                <input type="email" placeholder="Enter your Email"><br>
                <input type="password" placeholder="Enter your Password"><br>

                <button>Register Now</button>
                
                <p style="font-size: 12px;">Already have an Account? <a href="">Login</a></p>

        </form>
    </div>
            
    </div>
